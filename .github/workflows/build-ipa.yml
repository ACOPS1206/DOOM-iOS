name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply iOS compatibility patch
        run: git -C Vendor/doomgeneric apply ../../Patches/doomgeneric-ios.patch
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app without signing
        run: |
          xcodebuild \
            -project DOOM-iOS.xcodeproj \
            -scheme DOOM-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/DOOM-iOS.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/DOOM-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DOOM-iOS-unsigned
          path: build/DOOM-iOS-unsigned.ipa
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v1.1.1]')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DOOM-iOS-unsigned.ipa
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.1' }}
          target_commitish: ${{ github.sha }}
